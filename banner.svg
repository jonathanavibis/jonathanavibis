<svg width="1280" height="520" viewBox="0 0 1280 520"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050909"/>
      <stop offset="55%" stop-color="#0b1111"/>
      <stop offset="100%" stop-color="#001c17"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffaa"/>
      <stop offset="100%" stop-color="#00d9ff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35"
            fill="none"
            stroke="#00ffaa"
            stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="24" fill="url(#grid)"/>

  <!-- Decorative glow -->
  <circle cx="70" cy="70" r="150"
          fill="#00ffaa"
          opacity="0.05"
          filter="url(#glow)"/>

  <circle cx="1200" cy="450" r="180"
          fill="#00ffaa"
          opacity="0.05"
          filter="url(#glow)"/>

  <!-- Top accent -->
  <rect x="55" y="35" width="1170" height="2"
        fill="url(#accent)" opacity="0.7"/>

  <!-- Logo / Brand -->
  <text x="60" y="78"
        font-family="monospace"
        font-size="20"
        font-weight="bold"
        fill="#00ffaa">
    &lt;/&gt; jonathan_avibis
  </text>

  <!-- Main Name -->
  <text x="60" y="145"
        font-family="Arial, sans-serif"
        font-size="48"
        font-weight="800"
        fill="#ffffff">
    JONATHAN AVI BISWAS
  </text>

  <!-- Profession -->
  <text x="60" y="185"
        font-family="Arial, sans-serif"
        font-size="25"
        font-weight="600"
        fill="#00ffaa">
    WEB DEVELOPER
  </text>

  <!-- Divider -->
  <rect x="60" y="207" width="110" height="4"
        rx="2"
        fill="#00ffaa"/>

  <!-- About -->
  <text x="60" y="250"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="700"
        fill="#ffffff">
    ABOUT ME
  </text>

  <text x="60" y="280"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#c8d0d0">
    Dedicated web developer building responsive,
  </text>

  <text x="60" y="304"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#c8d0d0">
    modern and user-friendly web applications.
  </text>

  <text x="60" y="328"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#c8d0d0">
    Currently learning and improving modern web
  </text>

  <text x="60" y="352"
        font-family="Arial, sans-serif"
        font-size="15"
        fill="#c8d0d0">
    development technologies.
  </text>

  <!-- Skills -->
  <text x="60" y="395"
        font-family="Arial, sans-serif"
        font-size="19"
        font-weight="700"
        fill="#ffffff">
    SKILLS
