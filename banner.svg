    <rect x="340" y="415" width="105" height="30"
          rx="15" fill="#0c1917"
          stroke="#00ffaa"/>

    <text x="392" y="435"
          text-anchor="middle"
          fill="#00ffaa">TypeScript</text>


    <rect x="455" y="415" width="70" height="30"
          rx="15" fill="#0c1917"
          stroke="#00ffaa"/>

    <text x="490" y="435"
          text-anchor="middle"
          fill="#00ffaa">React</text>


    <rect x="535" y="415" width="80" height="30"
          rx="15" fill="#0c1917"
          stroke="#00ffaa"/>

    <text x="575" y="435"
          text-anchor="middle"
          fill="#00ffaa">Next.js</text>


    <rect x="625" y="415" width="85" height="30"
          rx="15" fill="#0c1917"
          stroke="#00ffaa"/>

    <text x="667" y="435"
